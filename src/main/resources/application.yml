spring:
  application:
    name: firstjobapp
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  port: ${SERVER_PORT:8081}
  error.include-message: never
app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  cors-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-secret-key-before-production-123456}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
---
spring:
  config.activate.on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/job_portal?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Aryan@123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate.ddl-auto: update
    show-sql: true
    properties.hibernate.format_sql: true
---
spring:
  config.activate.on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate.ddl-auto: validate
    show-sql: false
